[package]
name = "bkgclaw-gateway"
description = "The OpenClaw-style daemon: sessions, turns, approvals and events over REST + WebSocket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
bkgclaw-core = { workspace = true }
bkgclaw-store = { workspace = true }
bkgclaw-exec = { workspace = true }
bkg-evolve = { workspace = true }
axum = { version = "0.8", features = ["ws", "json"] }
futures-util = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }

[dev-dependencies]
tempfile = "3"
