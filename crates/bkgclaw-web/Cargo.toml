[package]
name = "bkgclaw-web"
description = "The web cockpit: chat, sessions, tools, approvals — Dioxus over the gateway's REST+WebSocket."
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["BKG"]

# Standalone WASM project (built by `dx build`, excluded from the native
# workspace): its dependencies only compile for the browser target.

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", default-features = false, features = ["json", "http"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "console", "Window", "Location"] }

[lib]
crate-type = ["lib", "cdylib"]
